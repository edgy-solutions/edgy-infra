# =============================================================================
# group_vars — COPY TO all.yml AND EDIT. The real one is gitignored.
# =============================================================================
# Secrets belong in ansible-vault or the environment, NOT here in plaintext.
# The two token fields below show both patterns; pick one and be consistent.
# =============================================================================

# --- Architecture: a first-class variable, not a future port ----------------
# The lab cluster is amd64. An ARM edge-cluster rebuild uses THESE SAME
# playbooks with this one value changed — image source, k3s binary arch and
# per-arch sysctls all key off it. Retrofitting arch-awareness later is the
# rework this exists to avoid.
#
# Supported: amd64 | arm64
arch: amd64

# --- Node substrate ---------------------------------------------------------
# lxc — lighter and denser, matches how the edge nodes run. Needs the tuning
#       in roles/k3s_node_prep (nesting, keyctl, AppArmor, /dev/kmsg,
#       snapshotter). Well-documented, but Proxmox-version sensitive.
# vm  — k3s "just works", no tuning at all. Costs more RAM/disk per node.
#
# THIS IS THE ESCAPE HATCH. If LXC fights you for more than an hour or two,
# flip this to `vm` and re-run provision.yml. On a cluster whose purpose is
# validating someone else's chart, runtime debugging is contamination.
node_type: lxc

# --- LXC specifics (ignored when node_type: vm) -----------------------------
# The template must ALREADY exist on proxmox_template_storage, ON EVERY NODE
# that will host a container — `local` is node-local storage, not shared, so
# a template present on the node you run commands from proves nothing about
# the others. provision.yml checks per node and prints the exact download
# command rather than guessing.
lxc_template: "debian-12-standard_12.12-1_amd64.tar.zst"

# UNPRIVILEGED — required, not preferred. This is the PROVEN configuration.
#
# Proxmox reserves every LXC feature flag except `nesting` to root@pam:
#   "changing feature flags (except nesting) is only allowed for root@pam"
# No ACL grant lifts that, so an API token cannot create a privileged
# container with the flags k3s needs. `false` is simply unreachable for
# token-driven automation regardless of what you grant it.
#
# This is a BETTER outcome than the privileged recipe most k3s-in-LXC guides
# assume. The cluster runs at a stricter isolation level, and the root SSH
# channel is used for exactly one thing (keyctl plus the raw lxc.* options)
# rather than becoming the general-purpose path of least resistance.
#
# Verified working: unprivileged + nesting + keyctl + KubeletInUserNamespace
# on k3s v1.31.4, across PVE 8.4.5 and 9.2.2 nodes in one cluster. Prefer
# this over the privileged fallback for an ARM edge rebuild too — it is the
# configuration with evidence behind it.
lxc_unprivileged: true

# --- VM specifics (ignored when node_type: lxc) -----------------------------
vm_image: "debian-12-genericcloud-amd64.qcow2"
vm_image_url: "https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2"

# --- k3s --------------------------------------------------------------------
k3s_version: "v1.31.4+k3s1"

# Disable the bundled ingress/LB only if you intend to bring your own.
# Traefik is left ON here because the OpenDDIL chart's ingress expects an
# ingress controller to exist.
k3s_disable: []

# Extra server args. --write-kubeconfig-mode is what lets the playbook fetch
# a usable kubeconfig without root gymnastics.
k3s_server_args: "--write-kubeconfig-mode 644"

# REQUIRED IN UNPRIVILEGED LXC — applied to the server AND every agent.
#
# kubelet writes global kernel tunables at startup (vm/overcommit_memory,
# kernel/panic, kernel/panic_on_oops). Those are readable but not writable
# from inside a user namespace, so ContainerManager refuses to start:
#
#   Failed to start ContainerManager err="[open /proc/sys/vm/overcommit_memory:
#   permission denied, open /proc/sys/kernel/panic: permission denied, ...]"
#
# The service then CRASH-LOOPS in `activating` rather than failing outright,
# so `systemctl status` shows something perpetually almost-starting. k3s
# prints the remedy itself: "Hint: enable KubeletInUserNamespace feature flag
# to ignore the error" — the gate makes kubelet skip writes it cannot perform.
#
# Since lxc_unprivileged is forced true by the API permission model, this is
# effectively mandatory. Empty it only if you run these playbooks against
# VMs (node_type: vm), where kubelet can write those tunables normally.
k3s_kubelet_args: "--kubelet-arg=feature-gates=KubeletInUserNamespace=true"

# LXC-only: overlayfs inside a container is the most common k3s-in-LXC
# failure. If containerd will not start, set this to "native".
# Leave empty to use the default snapshotter.
k3s_snapshotter: ""

# --- SSH --------------------------------------------------------------------
ssh_public_key: "ssh-ed25519 AAAA... you@workstation"
ansible_user: root

# --- SECRETS: use vault or env injection. Never plaintext in a real file. ---
# Pattern A — ansible-vault (recommended):
#   ansible-vault encrypt_string 's3cr3t' --name 'proxmox_api_token_secret'
# and paste the resulting block here.
#
# Pattern B — environment injection:
#   export PROXMOX_TOKEN=...
#   and leave the lookup below.
proxmox_api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN') }}"

# --- Rancher (optional) -----------------------------------------------------
# IMPORT the new cluster as a DOWNSTREAM managed cluster. These playbooks
# never touch the existing Rancher local/management cluster — running
# workloads on it is a named anti-pattern, and this stack (multiple brokers,
# Restate instances and Postgres) is exactly the tenant that degrades it.
#
# Leave rancher_import_url empty to skip the import entirely.
rancher_import_url: ""    # the `kubectl apply -f <url>` shown by Rancher's
                          # "Import Existing Cluster" flow
